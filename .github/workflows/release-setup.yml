name: Release Setup

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  build-setup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.workflow_run.head_branch }}"
          $version = $tag.TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish application
        run: dotnet publish src/aspnet/Finort.csproj -c Release -r win-x64 --self-contained true

      - name: Publish updater
        run: dotnet publish tools/Updater/Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer/finort.iss"

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: releases/finort-${{ steps.version.outputs.version }}-win-x64-setup.exe